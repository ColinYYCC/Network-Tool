# Stash 配置（由 Mihomo 配置转换）
# 配置作者：Colin(@ColinYYCC)
# 适用：Stash (iOS / macOS)
# 说明：已针对 Stash 官方推荐与内存限制做适配
# 状态：已通过多轮全量语法与逻辑检查

### 节点配置
NodeParam: &NodeParam
  type: http
  interval: 86400
  proxy: DIRECT
  health-check:
    enable: true
    url: https://networkcheck.kde.org
    interval: 600
  filter: '^(?!.*(?:(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持)|(?i:\b(?:USE|USED|COM|TOTAL|EXPIRE|EMAIL|Panel)\b)|[\p{Han}]\.com)).*$'

# 节点订阅
proxy-providers:
  MyMihomo:
    <<: *NodeParam
    url: '替换订阅链接'
  MyBackup:
    <<: *NodeParam
    url: '替换订阅链接'

### 核心配置
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 30

# 缓存配置
profile:
  store-selected: true
  store-fake-ip: true

### GEO 数据
geodata-mode: false
geox-url:
  geoip: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

