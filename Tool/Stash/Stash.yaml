### 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
    - +.mzstatic.com
    - +.icloud.com
    - +.icloud-content.com
    - gamecenter.apple.com

#### 节点组参数锚点
UrlTest: &UrlTest
  type: url-test
  url: https://networkcheck.kde.org
  interval: 600
  lazy: true
  tolerance: 50
  timeout: 3000
  disable-udp: false
  max-failed-times: 3
  hidden: true

FallBack: &FallBack
  type: fallback
  url: https://networkcheck.kde.org
  interval: 600
  lazy: true
  tolerance: 50
  timeout: 3000
  disable-udp: false
  max-failed-times: 3
  hidden: true

LoadBalance: &LoadBalance
  type: load-balance
  url: https://networkcheck.kde.org
  interval: 600
  lazy: true
  disable-udp: false
  strategy: consistent-hashing
  timeout: 3000
  max-failed-times: 3
  hidden: true

# 节点筛选正则
FilterHK: &FilterHK '^(?=.*(香港|HK|Hong|🇭🇰))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterJP: &FilterJP '^(?=.*(日本|JP|Japan|🇯🇵|川日|东京|大阪|泉日|埼玉))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterKR: &FilterKR '^(?=.*(韩国|韓|KR|Korea|🇰🇷|首尔))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterSG: &FilterSG '^(?=.*(新加坡|狮城|SG|Singapore|🇸🇬))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterUS: &FilterUS '^(?=.*(美国|US|United States|America|🇺🇸|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterTW: &FilterTW '^(?=.*(台湾|TW|Taiwan|Wan|🇹🇼))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterAll: &FilterAL '^(?!.*(?:(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持)|(?i:\b(?:USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b)|[\p{Han}]\.com)).*$'

