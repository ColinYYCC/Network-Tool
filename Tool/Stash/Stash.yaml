# Stash 配置
# 配置作者：Colin(@ColinYYCC)
# 由 Loon 配置 MyLoon.txt 转写，写法风格对齐 MyMihomo.yaml
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行

### 节点配置
# Loon 的 [Proxy] / [Remote Proxy] 为空，节点来自 App 内订阅，请把 url 换成你自己的订阅链接
proxy-providers:
  LoonNodes: {interval: 3600, url: 'https://example.com/your-subscription-url', benchmark-url: http://networkcheck.kde.org, benchmark-timeout: 3}
# 需要多个订阅时复制上一行并改名，再把各策略组的 use 改成对应名字
# Loon [Remote Filter] 的 7 条命名过滤器已下放到各策略组的 filter 字段

### 通用配置
mode: rule
log-level: info
allow-lan: true               # Loon: allow-wifi-access = true（HTTP/SOCKS 端口固定 7890）

### DNS 配置
# Loon 的 dns-server / doh-server / doq-server 在 Stash 中合并为 nameserver
dns:
  fake-ip-range: 198.18.0.1/16
  # 加密 DNS 的 bootstrap 服务器（Loon 未配置，Stash 解析 DoH/DoQ 域名时需要）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 9.9.9.9                            # Quad9
    - 2620:fe::fe                        # Quad9 IPv6
    - 223.5.5.5                          # AliDNS
    - 119.29.29.29                       # DNSPod
    - https://dns.quad9.net/dns-query    # Quad9 DoH
    - https://dns.alidns.com/dns-query   # AliDNS DoH
    - https://dns.pub/dns-query          # DNSPod DoH
    - quic://223.5.5.5:853               # AliDNS DoQ
    - quic://223.6.6.6:853               # AliDNS DoQ
  # 不分配 fake-ip 的域名（Loon: real-ip）
  fake-ip-filter:
    - 'dns.msftncsi.com'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - '*.turn.twilio.com'
    - '*.stun.twilio.com'
    - 'stun.syncthing.net'
    - 'stun.*'
    # > 本地回环域名（sslip.io / nip.io）
    - '127.*.*.*.sslip.io'
    - '127-*-*-*.sslip.io'
    - '*.127.*.*.*.sslip.io'
    - '*-127-*-*-*.sslip.io'
    - '127.*.*.*.nip.io'
    - '127-*-*-*.nip.io'
    - '*.127.*.*.*.nip.io'
    - '*-127-*-*-*.nip.io'
  # 指定域名使用指定 DNS 服务器（Loon [Host] 中 server: 形式的 196 条）
  nameserver-policy:
    # > Modify Contents
    "blog.google": "119.29.29.29"                              # Google CDN
