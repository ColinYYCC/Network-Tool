# mihomo 配置
# 配置作者：Colin(@ColinYYCC)
# 适用版本：所有使用 mihomo 核心的程序
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行

### 节点配置
NodeParam: &NodeParam {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: https://networkcheck.kde.org, interval: 600}, filter: '^(?!.*(?:(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持)|(?i:\b(?:USE|USED|COM|TOTAL|EXPIRE|EMAIL|Panel)\b)|[\p{Han}]\.com)).*$'}
# 节点订阅
proxy-providers:
  MyMihomo: {<<: *NodeParam, url: '替换订阅链接'}
  MyBackup: {<<: *NodeParam, url: '替换订阅链接'}

### 核心配置
mode: rule
mixed-port: 7893
allow-lan: true
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 30

# 实验性功能
experimental:
  quic-go-disable-gso: true

# 缓存配置：记住策略组选择和 fake-ip 映射
profile:
  store-selected: true
  store-fake-ip: true

# 认证配置（请务必修改默认密码）
authentication:
  - mihomo:Mh2026@SecurePass!
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8
  - ::1/128

### 如果使用的是裸核, 需要将下面的注释去掉, 方便ui界面的使用
# 管理面板配置
# external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
# external-controller: 127.0.0.1:9988
# secret: Mh2026@SecurePass!

### GEOIP 数据模式
geodata-mode: false
geox-url:
  geoip: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

