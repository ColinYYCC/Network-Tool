# mihomo 配置
# 配置作者：Colin(@ColinYYCC)
# 适用版本：所有使用 mihomo 核心的程序
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行

### 节点配置
NodeParam: &NodeParam {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: https://networkcheck.kde.org, interval: 600}, filter: '^(?!.*(?:(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持)|(?i:\b(?:USE|USED|COM|TOTAL|EXPIRE|EMAIL|Panel)\b)|[\p{Han}]\.com)).*$'}
# 节点订阅
proxy-providers:
  MyMihomo: {<<: *NodeParam, url: '替换订阅链接'}
  MyBackup: {<<: *NodeParam, url: '替换订阅链接'}

### 核心配置
mode: rule
mixed-port: 7893
allow-lan: true
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 30

# 实验性功能
experimental:
  quic-go-disable-gso: true

# 缓存配置：记住策略组选择和 fake-ip 映射
profile:
  store-selected: true
  store-fake-ip: true

# 认证配置（请务必修改默认密码）
authentication:
  - mihomo:Mh2026@SecurePass!
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8
  - ::1/128

### 如果使用的是裸核, 需要将下面的注释去掉, 方便ui界面的使用
# 管理面板配置
# external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
# external-controller: 127.0.0.1:9988
# secret: Mh2026@SecurePass!

### GEOIP 数据模式
geodata-mode: false
geox-url:
  geoip: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

### DNS配置
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 9.9.9.9
  nameserver:
    - https://dns.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://dns.quad9.net/dns-query
  direct-nameserver:
    - https://dns.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.internal'
    - 'localhost.ptlogin2.qq.com'
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '+.xboxlive.com'
    - 'stun.*'
    - '+.push.apple.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'networkcheck.kde.org'
    - '+.nvidia.com'
    - '+.stun.l.google.com'
    - '+.turn.l.google.com'
    - 'dns.msftncsi.com'

### 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
    - +.mzstatic.com
    - +.icloud.com
    - +.icloud-content.com
    - gamecenter.apple.com

### TUN配置
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
# 如果有使用 zerotier / headscale 等, 自行取消注释并填写
# route-exclude-address: ['192.168.110.0/24']

#### 节点组参数锚点
UrlTest: &UrlTest {type: url-test, url: https://networkcheck.kde.org, interval: 600, lazy: true, tolerance: 50, timeout: 3000, disable-udp: false, max-failed-times: 3, hidden: true}
FallBack: &FallBack {type: fallback, url: https://networkcheck.kde.org, interval: 600, lazy: true, tolerance: 50, timeout: 3000, disable-udp: false, max-failed-times: 3, hidden: true}
LoadBalance: &LoadBalance {type: load-balance, url: https://networkcheck.kde.org, interval: 600, lazy: true, disable-udp: false, strategy: consistent-hashing, timeout: 3000, max-failed-times: 3, hidden: true}

# 节点筛选正则
FilterHK: &FilterHK '^(?=.*(香港|HK|Hong|🇭🇰))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterJP: &FilterJP '^(?=.*(日本|JP|Japan|🇯🇵|川日|东京|大阪|泉日|埼玉))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterKR: &FilterKR '^(?=.*(韩国|韓|KR|Korea|🇰🇷|首尔))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterSG: &FilterSG '^(?=.*(新加坡|狮城|SG|Singapore|🇸🇬))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterUS: &FilterUS '^(?=.*(美国|US|United States|America|🇺🇸|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterTW: &FilterTW '^(?=.*(台湾|TW|Taiwan|Wan|🇹🇼))(?!.*(回国|校园|游戏|🎮|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterAll: &FilterAL '^(?!.*(?:(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持)|(?i:\b(?:USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b)|[\p{Han}]\.com)).*$'

