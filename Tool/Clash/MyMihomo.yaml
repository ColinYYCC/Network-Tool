  - DOMAIN-KEYWORD,anyviewer,DIRECT
  - DOMAIN-SUFFIX,globalwits.cn,DIRECT
  - DOMAIN-SUFFIX,cmbchina.com,DIRECT
  # Trae IDE
  - DOMAIN-SUFFIX,trae.com.cn,DIRECT
  - DOMAIN-SUFFIX,trae.cn,DIRECT
  - DOMAIN-SUFFIX,mchost.guru,DIRECT
  - DOMAIN-SUFFIX,trae.ai,国外网站
  - DOMAIN-KEYWORD,trae,国外网站
  # Web Controller
  - DOMAIN,yasd.royli.dev,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - DOMAIN,boxjs.com,DIRECT
  - DOMAIN,boxjs.net,DIRECT
  - DOMAIN-SUFFIX,vercel.app,国外网站
  # 保护丢包
  - IP-CIDR,0.0.0.0/32,REJECT
  # 邮件 / NTP
  - AND,((OR,((DST-PORT,25),(DST-PORT,110),(DST-PORT,143),(DST-PORT,465),(DST-PORT,587)))),DIRECT
  - AND,((OR,((DOMAIN,time-ios.apple.com),(DOMAIN,time.apple.com))),(DST-PORT,123)),DIRECT
  # 阻止海外 QUIC（对齐 Loon）
  - AND,((NOT,((GEOIP,CN))),(NETWORK,UDP),(DST-PORT,443)),REJECT

